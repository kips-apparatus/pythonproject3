<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In & Sign Up | DoseWise</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif; background: #fff;
    color: #10241d; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 40px 16px;
  }
  .login-shell { width: 100%; max-width: 420px; }
  .brand-row {
    display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px;
    text-decoration: none; color: #10241d;
  }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px; background: #0f8a6b;
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 20px; font-weight: 700;
  }
  .brand-name { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.3px; }
  
  .login-card {
    border: 1px solid #dfe9e3; border-radius: 20px; padding: 32px 28px;
    background: #fff; box-shadow: 0 14px 30px rgba(15,138,107,0.08);
  }

  /* Mode Switch Tabs */
  .tab-group {
    display: flex; background: #f2f7f4; padding: 4px; border-radius: 12px;
    margin-bottom: 24px; border: 1px solid #e2ece6;
  }
  .tab-btn {
    flex: 1; padding: 10px; border: none; background: none; border-radius: 9px;
    font-family: inherit; font-size: 0.9rem; font-weight: 700; color: #5c6b64;
    cursor: pointer; transition: all 0.18s ease; text-align: center;
  }
  .tab-btn.active {
    background: #ffffff; color: #0f8a6b; box-shadow: 0 2px 8px rgba(15,138,107,0.12);
  }

  .login-card h1 { font-size: 1.4rem; margin: 0 0 6px; color: #0d1b2a; }
  .login-card .lead { font-size: 0.9rem; color: #5c6b64; margin: 0 0 20px; line-height: 1.5; }

  /* Error Alert Box */
  .error-box {
    display: none; background: #fbeae8; border: 1px solid #f2c9c2; color: #c0392b;
    padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
    margin-bottom: 18px; text-align: center;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 700; color: #14532d; margin-bottom: 6px; }
  .field input {
    width: 100%; font-family: Arial, Helvetica, sans-serif; font-size: 0.95rem;
    padding: 11px 13px; border: 1px solid #cfe0d7; border-radius: 9px;
    background: #fafefb; color: #10241d; transition: all 0.15s ease;
  }
  .field input:focus {
    outline: none; border-color: #0f8a6b; box-shadow: 0 0 0 3px rgba(15,138,107,0.15); background: #ffffff;
  }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 20px; font-size: 0.82rem;
  }
  .row-between label { display: flex; align-items: center; gap: 6px; color: #4a564f; cursor: pointer; }
  .row-between a { color: #0f8a6b; text-decoration: none; font-weight: 700; }

  .submit-btn {
    width: 100%; background: #0f8a6b; color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-family: Arial, Helvetica, sans-serif; font-size: 0.98rem;
    font-weight: 700; cursor: pointer; transition: background 0.18s ease;
  }
  .submit-btn:hover { background: #0c7358; }

  .form-view { display: none; }
  .form-view.active { display: block; }

  .switch-note { text-align: center; font-size: 0.88rem; color: #5c6b64; margin-top: 22px; }
  .switch-note a { color: #0f8a6b; font-weight: 700; text-decoration: none; cursor: pointer; }
  .switch-note a:hover { text-decoration: underline; }

  .back-home {
    display: block; text-align: center; margin-top: 20px; color: #0f8a6b;
    font-weight: 700; text-decoration: none; font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="login-shell">
    <a href="/" class="brand-row">
      <div class="brand-mark">D</div>
      <div class="brand-name">DoseWise</div>
    </a>

    <div class="login-card">
      <!-- Tabs -->
      <div class="tab-group">
        <button type="button" class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
        <button type="button" class="tab-btn" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Error Alert -->
      <div class="error-box" id="authError"></div>

      <!-- Sign In View -->
      <div class="form-view active" id="signInView">
        <h1>Welcome back</h1>
        <p class="lead">Sign in to access your prescriptions and today's schedule.</p>

        <form id="signInForm">
          <div class="field">
            <label for="signinEmail">Email</label>
            <input type="email" id="signinEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="signinPassword">Password</label>
            <input type="password" id="signinPassword" placeholder="Enter your password" required>
          </div>
          <div class="row-between">
            <label><input type="checkbox" id="rememberMe" checked> Keep me signed in</label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="submit-btn" id="signinBtn">Sign In</button>
        </form>

        <p class="switch-note">New user? <a onclick="switchTab('signup')">Sign Up</a></p>
      </div>

      <!-- Sign Up View -->
      <div class="form-view" id="signUpView">
        <h1>Create Account</h1>
        <p class="lead">Register your account to manage family doses and prescriptions.</p>

        <form id="signUpForm">
          <div class="field">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="e.g. John Doe" required>
          </div>
          <div class="field">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Choose a password" minlength="4" required>
          </div>
          <div class="field">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="submit-btn" id="signupBtn">Create Account & Sign In</button>
        </form>

        <p class="switch-note">Already have an account? <a onclick="switchTab('signin')">Sign In</a></p>
      </div>

    </div>

    <a href="/" class="back-home">← Back to Landing Page</a>
  </div>

<script src="/auth.js"></script>
<script>
  function showError(msg) {
    const errBox = document.getElementById('authError');
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }

  function clearError() {
    const errBox = document.getElementById('authError');
    errBox.textContent = '';
    errBox.style.display = 'none';
  }

  function switchTab(mode) {
    clearError();
    const tabSignIn = document.getElementById('tabSignIn');
    const tabSignUp = document.getElementById('tabSignUp');
    const signInView = document.getElementById('signInView');
    const signUpView = document.getElementById('signUpView');

    if (mode === 'signup') {
      tabSignIn.classList.remove('active');
      tabSignUp.classList.add('active');
      signInView.classList.remove('active');
      signUpView.classList.add('active');
    } else {
      tabSignUp.classList.remove('active');
      tabSignIn.classList.add('active');
      signUpView.classList.remove('active');
      signInView.classList.add('active');
    }
  }

  // Handle Sign In Submission against Flask Backend Database
  document.getElementById('signInForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    const email = document.getElementById('signinEmail').value.trim().toLowerCase();
    const password = document.getElementById('signinPassword').value;

    if (!email.endsWith('@gmail.com')) {
      showError('Invalid email input');
      return;
    }

    const btn = document.getElementById('signinBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Invalid email input');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      Auth.login(data.user.name, data.user.email);
    } catch (err) {
      showError('Network error. Is the server running?');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  // Handle Sign Up Submission against Flask Backend Database
  document.getElementById('signUpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim().toLowerCase();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('signupConfirmPassword').value;

    if (!email.endsWith('@gmail.com')) {
      showError('Invalid email input');
      return;
    }

    if (password !== confirmPassword) {
      showError('Passwords do not match. Please check and try again.');
      return;
    }

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Invalid email input');
        btn.disabled = false;
        btn.textContent = 'Create Account & Sign In';
        return;
      }

      Auth.login(data.user.name, data.user.email);
    } catch (err) {
      showError('Network error. Is the server running?');
      btn.disabled = false;
      btn.textContent = 'Create Account & Sign In';
    }
  });
</script>
</body>
</html>
